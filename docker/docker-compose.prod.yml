version: '3.1'

services:
    agentforge:
        # Production overrides for deployment
        restart: unless-stopped
        environment:
            - DISPATCH_ENABLED=${DISPATCH_ENABLED_PROD:-true}
            - DISPATCH_CONTROLLER_URL=${DISPATCH_CONTROLLER_URL_PROD:-https://controller-prod.example.com}
            - LOG_LEVEL=${LOG_LEVEL:-info}
