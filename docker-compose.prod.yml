version: '3.1'

services:
    agentforge:
        image: agentforge
        restart: always
        environment:
            - PORT=${PORT:-3000}
            - DISPATCH_ENABLED=${DISPATCH_ENABLED:-true}
            - DISPATCH_CONTROLLER_URL=${DISPATCH_CONTROLLER_URL:-https://controller.example.com}
            - APP_ENV=production
        ports:
            - '${PORT:-3000}:${PORT:-3000}'
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:${PORT:-3000}/api/v1/ping']
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
